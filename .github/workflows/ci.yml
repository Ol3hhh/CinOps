name: CinOps CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  code-quality-and-tests:
    name: Code Quality and Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pytest

      - name: Backend Linting (Flake8)
        run: |
          cd backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=frontend,venv,.git,__pycache__
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=frontend,venv,.git,__pycache__

      - name: Backend Security (Bandit)
        run: |
          cd backend
          bandit -r . -x ./tests -ll

      - name: Backend Tests (Pytest)
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend Linting (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Frontend Tests (Vitest)
        run: |
          cd frontend
          npm test -- run

  secret-scan:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-security:
    name: Docker Build and Security Scan
    runs-on: ubuntu-latest
    needs: [code-quality-and-tests] 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t cinops-backend:latest ./backend -f backend/Dockerfile.backend

      - name: Scan Backend Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cinops-backend:latest'
          format: 'table'
          exit-code: '1' 
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend Image
        run: docker build -t cinops-frontend:latest ./frontend -f frontend/Dockerfile.frontend

      - name: Scan Frontend Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cinops-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'