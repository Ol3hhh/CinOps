services:
  backend:
    build: 
      context: .
      dockerfile: ./backend/Dockerfile.backend
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - cinops_network

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: cinops
    ports:
      - "5001:5432"
    networks:
      - cinops_network

networks:
  cinops_network:
    driver: bridge


